<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>商品列表 · 陶元的玩具商城</title>
  <link rel="preconnect" href="https://fonts.loli.net">
  <link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <div class="page">

    <header class="navbar">
      <button class="nav-back" onclick="history.back()">←</button>
      <div class="nav-title" id="listTitle" style="font-size:17px">全部玩具</div>
      <a class="nav-side search-pill" href="search.html" style="padding:7px 12px"><span class="sp-icon">🔍</span></a>
    </header>

    <!-- 排序条（照抄华为实测：综合/最新/评论数/价格）+ 筛选抽屉（年龄/价格区间/仅有货） -->
    <div class="sortbar" id="sortbar">
      <button class="sort-item on" data-sort="default">综合</button>
      <button class="sort-item" data-sort="new">最新</button>
      <button class="sort-item" data-sort="reviews">评论数</button>
      <button class="sort-item" data-sort="price" id="priceSort">价格 <span class="arr" id="priceArr"></span></button>
      <button class="filter-chip" id="filterBtn">筛选 ☰</button>
    </div>

    <div class="filter-drawer" id="filterDrawer">
      <div class="fd-inner">
        <div class="fd-row">
          <span class="fd-label">年龄段</span>
          <button class="chip on" data-age="">全部</button>
          <button class="chip" data-age="0-1岁">0-1岁</button>
          <button class="chip" data-age="1-2岁">1-2岁</button>
          <button class="chip" data-age="2-3岁">2-3岁</button>
        </div>
        <div class="fd-row">
          <span class="fd-label">价格区间</span>
          <input class="fd-input" id="pmin" type="number" placeholder="¥最低">
          <span style="color:var(--ink-3)">-</span>
          <input class="fd-input" id="pmax" type="number" placeholder="¥最高">
          <button class="chip on" id="instockChip" data-on="0">仅有货</button>
        </div>
        <div class="fd-row">
          <button class="btn btn-soft btn-mini" id="resetBtn">重置</button>
          <button class="btn btn-primary btn-mini" id="applyBtn" style="margin-left:auto">看结果</button>
        </div>
      </div>
    </div>

    <div style="padding:10px 14px;font-size:11px;color:var(--ink-3)" id="resultCount"></div>
    <div style="padding:0 14px"><div class="cards2" id="listBox"></div></div>
    <div id="emptyBox"></div>

  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<script src="data/db.js"></script>
<script src="js/app.js"></script>
<script>
/* 列表页状态：来源（品类/年龄/搜索词）+ 排序 + 筛选 */
const state = {
  cat: qs('cat') || '', age: qs('age') || '', q: qs('q') || '',
  sort: qs('sort') || 'default', priceDir: 0,   // priceDir: 0不排 1升序 2降序
  instock: false, pmin: null, pmax: null
};

function applyStateToUI() {
  if (state.cat) document.getElementById('listTitle').textContent = state.cat;
  else if (state.age) document.getElementById('listTitle').textContent = state.age + '玩具';
  else if (state.q) document.getElementById('listTitle').textContent = '「' + state.q + '」的结果';
  if (state.age) document.querySelectorAll('[data-age]').forEach(c => c.classList.toggle('on', c.dataset.age === state.age));
  document.querySelectorAll('.sort-item').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort || (b.dataset.sort === 'price' && state.priceDir > 0)));
  document.getElementById('priceArr').textContent = state.priceDir === 1 ? '↑' : state.priceDir === 2 ? '↓' : '';
  if (state.instock) { const c = document.getElementById('instockChip'); c.dataset.on = '1'; c.classList.add('on'); }
}

function getFiltered() {
  let arr = DB.products.slice();
  if (state.cat) arr = arr.filter(p => p.cat === state.cat);
  if (state.age) arr = arr.filter(p => p.age === state.age);
  if (state.q) arr = arr.filter(p => (p.name + p.point + p.cat).includes(state.q));
  if (state.instock) arr = arr.filter(p => p.stock > 0);
  if (state.pmin != null) arr = arr.filter(p => p.price >= state.pmin);
  if (state.pmax != null) arr = arr.filter(p => p.price <= state.pmax);
  if (state.sort === 'new') arr.sort((a, b) => (b.isNew - a.isNew) || (b.id < a.id ? -1 : 1));
  else if (state.sort === 'reviews') arr.sort((a, b) => b.reviewsN - a.reviewsN);
  else if (state.sort === 'price' && state.priceDir) arr.sort((a, b) => state.priceDir === 1 ? a.price - b.price : b.price - a.price);
  return arr;
}

function renderList() {
  const arr = getFiltered();
  document.getElementById('resultCount').textContent = `共 ${arr.length} 件 · 促销标签已前置展示`;
  document.getElementById('listBox').innerHTML = arr.map(cardHtml).join('');
  document.getElementById('emptyBox').innerHTML = arr.length ? '' : `
    <div class="empty"><span class="e-bear">🧸</span>
      <p>这个货架空空的~<br>看看别的好玩的吧</p>
      <a class="btn btn-primary btn-mini" href="list.html">看全部玩具</a>
    </div>`;
}

/* 事件：排序 / 价格三态 / 筛选抽屉 */
document.getElementById('sortbar').addEventListener('click', e => {
  const b = e.target.closest('.sort-item'); if (!b) return;
  const s = b.dataset.sort;
  if (s === 'price') {
    state.priceDir = state.priceDir === 0 ? 1 : state.priceDir === 1 ? 2 : 0;
    if (state.priceDir === 0) state.sort = 'default'; else state.sort = 'price';
  } else { state.sort = s; state.priceDir = 0; }
  applyStateToUI(); renderList();
});
document.getElementById('filterBtn').addEventListener('click', () => document.getElementById('filterDrawer').classList.toggle('open'));
document.getElementById('filterDrawer').addEventListener('click', e => {
  const chip = e.target.closest('[data-age]');
  if (chip) { state.age = chip.dataset.age; document.querySelectorAll('[data-age]').forEach(c => c.classList.toggle('on', c === chip)); }
  if (e.target.id === 'instockChip') {
    const c = e.target; state.instock = c.dataset.on !== '1';
    c.dataset.on = state.instock ? '1' : '0'; c.classList.toggle('on', state.instock);
  }
});
document.getElementById('applyBtn').addEventListener('click', () => {
  const mn = parseFloat(document.getElementById('pmin').value), mx = parseFloat(document.getElementById('pmax').value);
  state.pmin = isNaN(mn) ? null : mn; state.pmax = isNaN(mx) ? null : mx;
  document.getElementById('filterDrawer').classList.remove('open');
  renderList();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  Object.assign(state, { age: '', instock: false, pmin: null, pmax: null });
  document.querySelectorAll('[data-age]').forEach(c => c.classList.toggle('on', c.dataset.age === ''));
  const ic = document.getElementById('instockChip'); ic.dataset.on = '0'; ic.classList.remove('on');
  document.getElementById('pmin').value = ''; document.getElementById('pmax').value = '';
  renderList();
});

applyStateToUI();
renderList();
renderTabbar('cat');
</script>
</body>
</html>
